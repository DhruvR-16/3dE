<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat Editor — Photo → Editable 3D Scene</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="brand">
          <h1>Splat&nbsp;Editor</h1>
          <p class="tagline">photo → editable 3D scene</p>
        </header>

        <section class="panel">
          <label class="panel-label" for="scene-select">Scene</label>
          <select id="scene-select"></select>
        </section>

        <section class="panel grow">
          <div class="panel-label">Objects</div>
          <ul id="object-list"></ul>
        </section>

        <section class="panel">
          <div class="panel-label">Tool</div>
          <div class="btn-row" id="mode-buttons">
            <button data-mode="translate" class="active" title="Move (G)">Move</button>
            <button data-mode="rotate" title="Rotate (R)">Rotate</button>
            <button data-mode="scale" title="Scale (S)">Scale</button>
          </div>
          <div class="btn-row">
            <button id="btn-delete" disabled title="Delete selected (X / Del)">Delete</button>
            <button id="btn-restore" disabled>Restore</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-label">Export</div>
          <label class="check"><input type="checkbox" id="export-labeled" />keep object ids</label>
          <button id="btn-export" class="primary">Export edited .ply</button>
        </section>

        <section class="panel">
          <details>
            <summary class="panel-label">Import labeled .ply</summary>
            <input id="upload-id" type="text" placeholder="scene id (e.g. my-desk)" spellcheck="false" />
            <input id="upload-file" type="file" accept=".ply" />
            <button id="btn-upload">Upload &amp; split</button>
            <p class="hint">Output of the Kaggle pipeline notebook (scene.ply with object_id) goes here.</p>
          </details>
        </section>

        <footer class="keys">
          <span><kbd>click</kbd> select</span>
          <span><kbd>G</kbd>/<kbd>R</kbd>/<kbd>S</kbd> tool</span>
          <span><kbd>X</kbd> delete</span>
          <span><kbd>Esc</kbd> deselect</span>
        </footer>
      </aside>

      <main id="viewport">
        <div id="viewer-root"></div>
        <div id="status" class="status"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
